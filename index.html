<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planificación Financiera — Flujo de Caja Consolidado</title>

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <!-- ===================== LOGIN (solo en modo Firebase) ===================== -->
  <div id="login-overlay" class="login-overlay d-none">
    <div class="login-card">
      <div class="text-center mb-3">
        <i class="bi bi-cash-coin fs-1 text-primary"></i>
        <h4 class="mt-2 mb-0">Planificación Financiera</h4>
        <p class="text-muted small">Flujo de caja consolidado de proyectos</p>
      </div>
      <div id="login-error" class="alert alert-danger py-2 d-none"></div>
      <div class="mb-2">
        <label class="form-label small">Correo</label>
        <input type="email" id="login-email" class="form-control" placeholder="tu.correo@ingevec.cl" />
      </div>
      <div class="mb-3">
        <label class="form-label small">Contraseña</label>
        <input type="password" id="login-password" class="form-control" />
      </div>
      <button id="login-btn" class="btn btn-primary w-100 mb-2">Ingresar</button>
      <button id="login-google" class="btn btn-outline-secondary w-100">
        <i class="bi bi-google me-1"></i> Ingresar con Google
      </button>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app-shell" class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-cash-coin"></i>
        <span>Planificación<br />Financiera</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" data-view="dashboard"><i class="bi bi-speedometer2"></i> Consolidado</a>
        <a href="#" class="nav-link" data-view="categorias-view"><i class="bi bi-diagram-3"></i> Por categoría</a>
        <a href="#" class="nav-link" data-view="proyectos"><i class="bi bi-building"></i> Por proyecto</a>
        <a href="#" class="nav-link" data-view="importar"><i class="bi bi-file-earmark-arrow-up"></i> Importar Excel</a>
        <a href="#" class="nav-link" data-view="caja"><i class="bi bi-bank"></i> Caja del banco</a>
        <a href="#" class="nav-link" data-view="pagos"><i class="bi bi-calendar-check"></i> Programar pagos</a>
        <a href="#" class="nav-link" data-view="reportes"><i class="bi bi-file-earmark-bar-graph"></i> Reportes</a>
        <a href="#" class="nav-link" data-view="config"><i class="bi bi-gear"></i> Configuración</a>
      </nav>
      <div class="sidebar-footer">
        <div id="mode-badge" class="badge-mode"></div>
        <div id="user-box" class="user-box d-none">
          <span id="user-email" class="small text-truncate"></span>
          <button id="logout-btn" class="btn btn-sm btn-link text-muted p-0" title="Salir"><i class="bi bi-box-arrow-right"></i></button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <h5 id="view-title" class="mb-0">Consolidado</h5>
        <div class="topbar-actions">
          <span class="text-muted small me-2">Moneda:</span>
          <span id="moneda-label" class="badge bg-secondary">UF</span>
        </div>
      </header>

      <div class="content">
        <!-- Cada vista es un <section> con id; app.js muestra/oculta -->
        <section id="dashboard" class="view"></section>
        <section id="categorias-view" class="view d-none"></section>
        <section id="proyectos" class="view d-none"></section>
        <section id="importar" class="view d-none"></section>
        <section id="caja" class="view d-none"></section>
        <section id="pagos" class="view d-none"></section>
        <section id="reportes" class="view d-none"></section>
        <section id="config" class="view d-none"></section>
      </div>
    </main>
  </div>

  <!-- Contenedor de toasts -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- JS: librerías -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Firebase SDK (namespaced v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- JS: app -->
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="charts.js"></script>
  <script src="importer.js"></script>
  <script src="reports.js"></script>
  <script src="app.js"></script>
</body>
</html>
